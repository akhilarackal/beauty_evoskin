<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128" fill="none">
  <!-- Hydrating Face Wash – soft teal pump tube -->
  <rect width="96" height="128" rx="4" fill="#F3F4F6"/>
  <!-- tube body -->
  <rect x="30" y="44" width="36" height="66" rx="8" fill="url(#fw-grad)"/>
  <defs>
    <linearGradient id="fw-grad" x1="30" y1="44" x2="66" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#81D4CA"/>
      <stop offset="100%" stop-color="#26A69A"/>
    </linearGradient>
  </defs>
  <!-- tube sheen -->
  <rect x="32" y="46" width="10" height="62" rx="4" fill="white" opacity=".2"/>
  <!-- shoulder -->
  <path d="M30 44 Q30 36 38 34 L58 34 Q66 36 66 44Z" fill="#81D4CA"/>
  <!-- neck -->
  <rect x="43" y="20" width="10" height="16" rx="2" fill="#9BE0D8"/>
  <!-- pump collar -->
  <rect x="40" y="13" width="16" height="9" rx="3" fill="#00796B"/>
  <!-- pump stem -->
  <rect x="46" y="7" width="4" height="8" rx="1" fill="#00897B"/>
  <!-- pump head disc -->
  <ellipse cx="48" cy="7" rx="8" ry="3.5" fill="#00695C"/>
  <!-- label -->
  <rect x="32" y="54" width="32" height="46" rx="2" fill="white" opacity=".88"/>
  <!-- label top stripe -->
  <rect x="32" y="54" width="32" height="6" rx="1" fill="#00796B"/>
  <!-- droplet icon -->
  <path d="M48 63 Q50 67 50 69 Q50 72 48 72 Q46 72 46 69 Q46 67 48 63Z" fill="#26A69A" opacity=".7"/>
  <!-- label lines -->
  <rect x="34" y="76" width="28" height="2.5" rx="1" fill="#00796B" opacity=".8"/>
  <rect x="35" y="82" width="26" height="1.5" rx=".75" fill="#374151" opacity=".5"/>
  <rect x="35" y="86" width="26" height="1.5" rx=".75" fill="#374151" opacity=".5"/>
  <rect x="36" y="90" width="24" height="1.5" rx=".75" fill="#374151" opacity=".4"/>
  <!-- bottom stripe -->
  <rect x="32" y="97" width="32" height="3" rx="1" fill="#00796B"/>
</svg>
