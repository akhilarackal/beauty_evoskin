<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128" fill="none">
  <!-- After Shave Serum – tall clear pump bottle, navy cap -->
  <rect width="96" height="128" rx="4" fill="#F3F4F6"/>
  <!-- bottle body -->
  <rect x="33" y="46" width="30" height="62" rx="6" fill="#E8EDF5"/>
  <!-- glass sheen left -->
  <rect x="35" y="48" width="7" height="58" rx="3" fill="white" opacity=".5"/>
  <!-- glass sheen right highlight -->
  <rect x="56" y="50" width="4" height="54" rx="2" fill="white" opacity=".2"/>
  <!-- shoulder -->
  <path d="M33 46 Q33 38 40 36 L56 36 Q63 38 63 46Z" fill="#CDD5E8"/>
  <!-- neck -->
  <rect x="43" y="22" width="10" height="16" rx="2" fill="#B8C4DC"/>
  <!-- pump collar -->
  <rect x="41" y="16" width="14" height="8" rx="2" fill="#1E3A5F"/>
  <!-- pump stem -->
  <rect x="46" y="9" width="4" height="9" rx="1" fill="#2D5282"/>
  <!-- pump head -->
  <ellipse cx="48" cy="8" rx="7" ry="3.5" fill="#1E3A5F"/>
  <!-- label background -->
  <rect x="35" y="55" width="26" height="44" rx="2" fill="white" opacity=".85"/>
  <!-- label top color band -->
  <rect x="35" y="55" width="26" height="6" rx="1" fill="#1E3A5F"/>
  <!-- label text lines -->
  <rect x="37" y="65" width="22" height="2.5" rx="1" fill="#1E3A5F" opacity=".8"/>
  <rect x="38" y="71" width="20" height="1.5" rx=".75" fill="#374151" opacity=".6"/>
  <rect x="38" y="75" width="20" height="1.5" rx=".75" fill="#374151" opacity=".6"/>
  <rect x="39" y="79" width="18" height="1.5" rx=".75" fill="#374151" opacity=".4"/>
  <rect x="39" y="83" width="18" height="1.5" rx=".75" fill="#374151" opacity=".4"/>
  <!-- bottom accent line -->
  <rect x="35" y="96" width="26" height="3" rx="1" fill="#1E3A5F"/>
</svg>
