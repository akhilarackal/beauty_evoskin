<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128" fill="none">
  <!-- Anti-Fatigue Eye Rescue Cream – amber glass dropper -->
  <rect width="96" height="128" rx="4" fill="#F3F4F6"/>
  <!-- bottle body -->
  <rect x="34" y="50" width="28" height="56" rx="5" fill="#8B5E3C"/>
  <!-- glass sheen -->
  <rect x="36" y="52" width="8" height="50" rx="3" fill="white" opacity=".12"/>
  <!-- shoulder taper -->
  <path d="M34 50 Q34 42 40 40 L56 40 Q62 42 62 50Z" fill="#8B5E3C"/>
  <!-- neck -->
  <rect x="43" y="26" width="10" height="16" rx="2" fill="#A0724A"/>
  <!-- black dropper pump cap -->
  <rect x="40" y="14" width="16" height="14" rx="4" fill="#1A1A1A"/>
  <!-- pump stem -->
  <rect x="46" y="8" width="4" height="8" rx="1" fill="#333"/>
  <!-- pump head -->
  <rect x="43" y="5" width="10" height="5" rx="2" fill="#222"/>
  <!-- label -->
  <rect x="36" y="58" width="24" height="40" rx="2" fill="#6B4423"/>
  <!-- label top accent -->
  <rect x="36" y="58" width="24" height="5" rx="1" fill="#D4A04A"/>
  <!-- label lines -->
  <rect x="38" y="67" width="20" height="2.5" rx="1" fill="#D4A04A" opacity=".9"/>
  <rect x="39" y="73" width="18" height="1.5" rx=".75" fill="white" opacity=".7"/>
  <rect x="40" y="77" width="16" height="1.5" rx=".75" fill="white" opacity=".5"/>
  <rect x="40" y="81" width="16" height="1.5" rx=".75" fill="white" opacity=".5"/>
  <rect x="41" y="85" width="14" height="1.5" rx=".75" fill="white" opacity=".4"/>
  <!-- small leaf ornament -->
  <path d="M44 91 Q48 88 52 91 Q48 94 44 91Z" fill="#D4A04A" opacity=".7"/>
</svg>
