<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128" fill="none">
  <!-- Herbal Body Lotion – tall pump bottle, warm cream color -->
  <rect width="96" height="128" rx="4" fill="#F3F4F6"/>
  <!-- bottle body -->
  <rect x="30" y="40" width="36" height="70" rx="8" fill="url(#hl-grad)"/>
  <defs>
    <linearGradient id="hl-grad" x1="30" y1="40" x2="66" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>
  <!-- sheen -->
  <rect x="32" y="42" width="10" height="66" rx="4" fill="white" opacity=".35"/>
  <!-- shoulder -->
  <path d="M30 40 Q30 32 38 30 L58 30 Q66 32 66 40Z" fill="#FEF3C7"/>
  <!-- neck -->
  <rect x="43" y="16" width="10" height="16" rx="2" fill="#FDE68A"/>
  <!-- pump collar -->
  <rect x="40" y="10" width="16" height="8" rx="3" fill="#78350F"/>
  <!-- pump stem -->
  <rect x="46" y="4" width="4" height="8" rx="1" fill="#92400E"/>
  <!-- pump head -->
  <ellipse cx="48" cy="4" rx="9" ry="4" fill="#78350F"/>
  <!-- pump head sheen -->
  <ellipse cx="44" cy="3" rx="4" ry="2" fill="white" opacity=".15"/>
  <!-- label -->
  <rect x="32" y="50" width="32" height="50" rx="3" fill="white" opacity=".85"/>
  <!-- warm brown top band -->
  <rect x="32" y="50" width="32" height="7" rx="2" fill="#78350F"/>
  <!-- herb/leaf motif -->
  <path d="M48 64 C43 69 43 75 48 78 C53 75 53 69 48 64Z" fill="#92400E" opacity=".2"/>
  <path d="M44 70 C44 70 48 68 52 70" stroke="#78350F" stroke-width="1" stroke-linecap="round" opacity=".4"/>
  <path d="M44 73 C44 73 48 71 52 73" stroke="#78350F" stroke-width="1" stroke-linecap="round" opacity=".4"/>
  <!-- small flowers -->
  <circle cx="41" cy="67" r="2" fill="#D97706" opacity=".5"/>
  <circle cx="55" cy="67" r="2" fill="#D97706" opacity=".5"/>
  <!-- label text lines -->
  <rect x="34" y="82" width="28" height="2.5" rx="1" fill="#78350F" opacity=".8"/>
  <rect x="35" y="88" width="26" height="1.5" rx=".75" fill="#374151" opacity=".5"/>
  <rect x="35" y="92" width="26" height="1.5" rx=".75" fill="#374151" opacity=".5"/>
  <rect x="36" y="96" width="24" height="1.5" rx=".75" fill="#374151" opacity=".4"/>
</svg>
