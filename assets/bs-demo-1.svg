<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128" fill="none">
  <!-- SOS Hydra Repair Intensive Serum – dark blue dropper bottle -->
  <rect width="96" height="128" rx="4" fill="#F3F4F6"/>
  <!-- bottle body -->
  <rect x="36" y="52" width="24" height="52" rx="4" fill="#1E3A5F"/>
  <!-- shoulder -->
  <path d="M36 52 Q36 44 42 42 L54 42 Q60 44 60 52Z" fill="#1E3A5F"/>
  <!-- neck -->
  <rect x="43" y="28" width="10" height="16" rx="2" fill="#2D5282"/>
  <!-- dropper cap -->
  <rect x="41" y="18" width="14" height="12" rx="3" fill="#C0A060"/>
  <!-- dropper tip -->
  <rect x="46" y="13" width="4" height="7" rx="1" fill="#C0A060"/>
  <!-- drop -->
  <ellipse cx="48" cy="11" rx="2" ry="2.5" fill="#A0C4FF"/>
  <!-- label area -->
  <rect x="38" y="60" width="20" height="36" rx="2" fill="#162D4A"/>
  <!-- label gold stripe -->
  <rect x="38" y="60" width="20" height="4" rx="1" fill="#C0A060"/>
  <!-- label text lines -->
  <rect x="40" y="68" width="16" height="2" rx="1" fill="#C0A060" opacity=".9"/>
  <rect x="41" y="73" width="14" height="1.5" rx="0.75" fill="white" opacity=".6"/>
  <rect x="42" y="77" width="12" height="1.5" rx="0.75" fill="white" opacity=".6"/>
  <rect x="42" y="81" width="12" height="1.5" rx="0.75" fill="white" opacity=".4"/>
  <rect x="43" y="85" width="10" height="1.5" rx="0.75" fill="white" opacity=".4"/>
  <!-- logo circle -->
  <circle cx="48" cy="92" r="4" fill="none" stroke="#C0A060" stroke-width="1"/>
  <circle cx="48" cy="92" r="2" fill="#C0A060" opacity=".5"/>
</svg>
