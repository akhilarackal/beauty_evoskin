<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128" fill="none">
  <!-- Brightening Night Cream – purple glass jar with gold lid -->
  <rect width="96" height="128" rx="4" fill="#F3F4F6"/>
  <!-- jar shadow -->
  <ellipse cx="48" cy="103" rx="26" ry="5" fill="#6B21A8" opacity=".15"/>
  <!-- jar body -->
  <rect x="18" y="66" width="60" height="38" rx="10" fill="url(#nc-grad)"/>
  <defs>
    <linearGradient id="nc-grad" x1="18" y1="66" x2="78" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>
  <!-- jar sheen -->
  <rect x="20" y="68" width="14" height="34" rx="5" fill="white" opacity=".15"/>
  <!-- jar highlight right -->
  <rect x="62" y="70" width="8" height="30" rx="3" fill="white" opacity=".08"/>
  <!-- label on jar -->
  <rect x="22" y="72" width="52" height="28" rx="4" fill="white" opacity=".1"/>
  <!-- label lines -->
  <rect x="25" y="78" width="46" height="2.5" rx="1" fill="#E9D5FF" opacity=".9"/>
  <rect x="27" y="84" width="42" height="1.5" rx=".75" fill="#E9D5FF" opacity=".6"/>
  <rect x="29" y="88" width="38" height="1.5" rx=".75" fill="#E9D5FF" opacity=".5"/>
  <!-- gold lid -->
  <ellipse cx="48" cy="66" rx="30" ry="8" fill="#B8860B"/>
  <!-- lid top -->
  <ellipse cx="48" cy="60" rx="28" ry="7" fill="#D4AF37"/>
  <!-- lid sheen -->
  <ellipse cx="38" cy="58" rx="10" ry="4" fill="white" opacity=".3"/>
  <!-- center motif -->
  <circle cx="48" cy="59" r="8" fill="none" stroke="#B8860B" stroke-width="1.5"/>
  <circle cx="48" cy="59" r="4" fill="#B8860B" opacity=".5"/>
  <!-- star sparkle -->
  <path d="M48 54 L49 57 L52 57 L50 59 L51 62 L48 60 L45 62 L46 59 L44 57 L47 57Z" fill="#FFD700" opacity=".9"/>
</svg>
