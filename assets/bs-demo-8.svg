<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128" fill="none">
  <!-- Aloe Vera Gel – tall clear gel tube, green cap -->
  <rect width="96" height="128" rx="4" fill="#F3F4F6"/>
  <!-- tube body -->
  <rect x="34" y="42" width="28" height="68" rx="6" fill="url(#av-grad)"/>
  <defs>
    <linearGradient id="av-grad" x1="34" y1="42" x2="62" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4EDDA"/>
      <stop offset="100%" stop-color="#A8D5B5"/>
    </linearGradient>
  </defs>
  <!-- sheen -->
  <rect x="36" y="44" width="8" height="64" rx="3" fill="white" opacity=".4"/>
  <!-- shoulder -->
  <path d="M34 42 Q34 34 40 32 L56 32 Q62 34 62 42Z" fill="#C3E6CB"/>
  <!-- neck -->
  <rect x="43" y="18" width="10" height="16" rx="2" fill="#B2DFDB"/>
  <!-- green cap -->
  <rect x="40" y="8" width="16" height="12" rx="4" fill="#2E7D32"/>
  <!-- cap detail -->
  <rect x="42" y="10" width="12" height="8" rx="3" fill="#388E3C" opacity=".7"/>
  <!-- cap sheen -->
  <rect x="42" y="10" width="4" height="7" rx="2" fill="white" opacity=".2"/>
  <!-- label white panel -->
  <rect x="36" y="52" width="24" height="48" rx="2" fill="white" opacity=".85"/>
  <!-- green stripe top -->
  <rect x="36" y="52" width="24" height="5" rx="1" fill="#2E7D32"/>
  <!-- aloe leaf icon -->
  <path d="M48 62 C44 66 43 70 48 74 C53 70 52 66 48 62Z" fill="#4CAF50" opacity=".6"/>
  <path d="M48 63 C45 67 44 70 48 73" stroke="#2E7D32" stroke-width="0.8" stroke-linecap="round" opacity=".5"/>
  <!-- label lines -->
  <rect x="38" y="78" width="20" height="2.5" rx="1" fill="#2E7D32" opacity=".8"/>
  <rect x="39" y="84" width="18" height="1.5" rx=".75" fill="#374151" opacity=".5"/>
  <rect x="39" y="88" width="18" height="1.5" rx=".75" fill="#374151" opacity=".5"/>
  <rect x="40" y="92" width="16" height="1.5" rx=".75" fill="#374151" opacity=".4"/>
  <!-- bottom stripe -->
  <rect x="36" y="97" width="24" height="3" rx="1" fill="#2E7D32"/>
</svg>
