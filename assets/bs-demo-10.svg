<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128" fill="none">
  <!-- Beard Growth Oil – dark green slim bottle with dropper -->
  <rect width="96" height="128" rx="4" fill="#F3F4F6"/>
  <!-- bottle body -->
  <rect x="36" y="50" width="24" height="60" rx="5" fill="url(#bg-grad)"/>
  <defs>
    <linearGradient id="bg-grad" x1="36" y1="50" x2="60" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>
  </defs>
  <!-- glass sheen -->
  <rect x="38" y="52" width="7" height="56" rx="3" fill="white" opacity=".15"/>
  <!-- shoulder -->
  <path d="M36 50 Q36 42 42 40 L54 40 Q60 42 60 50Z" fill="#2D6A4F"/>
  <!-- neck -->
  <rect x="43" y="26" width="10" height="16" rx="2" fill="#40916C"/>
  <!-- dropper bulb – black rubber -->
  <ellipse cx="48" cy="23" rx="7" ry="5" fill="#1A1A1A"/>
  <ellipse cx="48" cy="20" rx="6" ry="4" fill="#333"/>
  <!-- dropper tip -->
  <rect x="46" y="14" width="4" height="10" rx="1" fill="#555"/>
  <!-- oil drop -->
  <path d="M48 12 Q50 15 50 16.5 Q50 18 48 18 Q46 18 46 16.5 Q46 15 48 12Z" fill="#D4AC0D" opacity=".9"/>
  <!-- label -->
  <rect x="38" y="58" width="20" height="43" rx="2" fill="#1B4332"/>
  <!-- label gold border -->
  <rect x="38" y="58" width="20" height="43" rx="2" fill="none" stroke="#D4AC0D" stroke-width="1"/>
  <!-- leaf icon -->
  <path d="M48 66 C44 70 44 75 48 77 C52 75 52 70 48 66Z" fill="#52B788" opacity=".8"/>
  <line x1="48" y1="67" x2="48" y2="76" stroke="#2D6A4F" stroke-width="0.8"/>
  <!-- label text lines -->
  <rect x="39" y="81" width="18" height="2.5" rx="1" fill="#D4AC0D" opacity=".9"/>
  <rect x="40" y="87" width="16" height="1.5" rx=".75" fill="#B7E4C7" opacity=".7"/>
  <rect x="40" y="91" width="16" height="1.5" rx=".75" fill="#B7E4C7" opacity=".6"/>
  <rect x="41" y="95" width="14" height="1.5" rx=".75" fill="#B7E4C7" opacity=".5"/>
</svg>
